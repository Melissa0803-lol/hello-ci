name: Hello CI/CD
on:
  push:
    branches: ["main"]
jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t hello-ci:latest .
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hello-ci:latest
          severity: CRITICAL,HIGH
          format: table
          exit-code: 0
